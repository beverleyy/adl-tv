name: Deploy demo to GitHub Pages

# Publishes the simulated-traffic demo (see tools/build_demo.py). One-time setup in your repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the demo before publishing it
        run: |
          node tests/test_demo.js
          python -m unittest tests.test_build
      - name: Build the demo
        run: python tools/build_demo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
